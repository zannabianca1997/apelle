events {
}

http {
    include inbound/upstreams.conf;

    server {
        listen 80       default_server;
        listen [::]:80  default_server;

        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://partyat.apelle.space$request_uri;
        }
    }

    server {
        listen 443      ssl;
        listen [::]:443 ssl;

        http2 on;

        server_name partyat.apelle.space;

        ssl_certificate /etc/letsencrypt/live/partyat.apelle.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/partyat.apelle.space/privkey.pem;
        ssl_session_cache shared:le_nginx_SSL:10m;
        ssl_session_timeout 1440m;
        ssl_session_tickets off;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        # ssl_dhparam /etc/letsencrydefault_serverpt/ssl-dhparams.pem;

        include inbound/locations.conf;

        root /usr/share/nginx/html;

        location / {
            include  mime.types;
            sendfile on;

            # This is due to nginx and the try_files behavior below, it will always
            # try to hit the index as part of try_files.  If I set index as something
            # that doesn't resolve, we don't have to worry about index.html being cached.
            index unresolvable-file-html.html;

            try_files $uri @index;
        }

        # This seperate location is so the no cache policy only applies to the index and nothing else.
        location @index {
            root /usr/share/nginx/html;

            # Do not cache
            add_header Cache-Control no-cache;
            expires 0;

            try_files /index.html =404;
        }
    }  


    server {
        listen 8080;

        # only the inner services see us as this
        server_name gateway;

        include outbound/locations.conf;
    }
}